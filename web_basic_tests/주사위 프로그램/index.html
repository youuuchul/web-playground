<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Dice Roller</title>
    <style>
        :root {
            --bg: #1a1a2d;
            --card: #2d2d44;
            --accent: #ff6b6b;
            --text: #ffffff;
            --dice-bg: #f8f9fa;
            --dice-text: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 { margin-top: 0; margin-bottom: 1.5rem; font-size: 1.8rem; }

        /* 탭 메뉴 스타일 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* 주사위 화면 영역 */
        .mode-section {
            display: none; /* 기본적으로 숨김 */
            animation: fadeIn 0.5s;
        }
        .mode-section.active {
            display: block; /* 활성화된 것만 보임 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 주사위 결과 보여주는 박스 */
        .result-area {
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .dice {
            width: 80px;
            height: 80px;
            background-color: var(--dice-bg);
            color: var(--dice-text);
            font-size: 2rem;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #ccc;
            border: 2px solid #333;
        }

        /* 굴리기 버튼 스타일 */
        .roll-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transition: transform 0.1s;
        }
        .roll-btn:active { transform: scale(0.95); }

        /* TRPG 버튼 그리드 */
        .trpg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .trpg-btn {
            background: #3d3d5c;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .trpg-btn:hover { background: #4d4d75; }

        /* 애니메이션 효과 */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
        
        .total-score { font-size: 1.2rem; margin-top: 10px; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h1>🎲 Vibe Dice Roller</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('basic')">기본 (1개)</button>
        <button class="tab-btn" onclick="openTab('double')">더블 (2개)</button>
        <button class="tab-btn" onclick="openTab('trpg')">TRPG 세트</button>
    </div>

    <div id="basic" class="mode-section active">
        <div class="result-area">
            <div id="dice1-visual" class="dice">?</div>
        </div>
        <button class="roll-btn" onclick="rollBasic()">굴리기 (Roll)</button>
    </div>

    <div id="double" class="mode-section">
        <div class="result-area">
            <div id="dice2-1" class="dice">?</div>
            <div id="dice2-2" class="dice">?</div>
        </div>
        <div id="double-total" class="total-score">합계: -</div>
        <br>
        <button class="roll-btn" onclick="rollDouble()">두 개 굴리기</button>
    </div>

    <div id="trpg" class="mode-section">
        <div class="result-area">
            <div id="trpg-visual" class="dice" style="width:100px; height:100px; border-radius:50%;">D20</div>
        </div>
        <div id="trpg-desc" style="margin-bottom:15px; color:#aaa;">주사위를 선택하세요</div>
        
        <div class="trpg-grid">
            <button class="trpg-btn" onclick="rollTrpg(4)">D4 (4면)</button>
            <button class="trpg-btn" onclick="rollTrpg(6)">D6 (6면)</button>
            <button class="trpg-btn" onclick="rollTrpg(8)">D8 (8면)</button>
            <button class="trpg-btn" onclick="rollTrpg(10)">D10 (10면)</button>
            <button class="trpg-btn" onclick="rollTrpg(12)">D12 (12면)</button>
            <button class="trpg-btn" onclick="rollTrpg(20)" style="color:var(--accent); font-weight:bold;">D20 (20면)</button>
        </div>
    </div>
</div>

<script>
    // 탭 전환 기능
    function openTab(tabName) {
        // 모든 섹션 숨기기
        document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        // 선택한 섹션만 보이기
        document.getElementById(tabName).classList.add('active');
        // 클릭된 버튼 스타일 활성화 (event.target은 조금 복잡할 수 있어서 간단히 처리)
        const buttons = document.querySelectorAll('.tab-btn');
        if(tabName === 'basic') buttons[0].classList.add('active');
        if(tabName === 'double') buttons[1].classList.add('active');
        if(tabName === 'trpg') buttons[2].classList.add('active');
    }

    // [핵심] 랜덤 숫자 생성 함수
    function getRandom(max) {
        return Math.floor(Math.random() * max) + 1;
    }

    // 1. 기본 주사위 굴리기
    function rollBasic() {
        const diceElement = document.getElementById('dice1-visual');
        
        // 애니메이션 효과 (클래스 줬다 뺏기)
        diceElement.classList.add('shake');
        diceElement.innerText = "..."
        
        setTimeout(() => {
            const result = getRandom(6);
            diceElement.innerText = result;
            diceElement.classList.remove('shake');
        }, 400); // 0.4초 뒤에 결과 나옴
    }

    // 2. 더블 주사위 굴리기
    function rollDouble() {
        const d1 = document.getElementById('dice2-1');
        const d2 = document.getElementById('dice2-2');
        const totalText = document.getElementById('double-total');

        d1.classList.add('shake');
        d2.classList.add('shake');

        setTimeout(() => {
            const r1 = getRandom(6);
            const r2 = getRandom(6);
            
            d1.innerText = r1;
            d2.innerText = r2;
            totalText.innerText = `합계: ${r1 + r2}`;
            
            d1.classList.remove('shake');
            d2.classList.remove('shake');
        }, 400);
    }

    // 3. TRPG 주사위 굴리기
    function rollTrpg(sides) {
        const visual = document.getElementById('trpg-visual');
        const desc = document.getElementById('trpg-desc');
        
        visual.classList.add('shake');
        visual.innerText = "?";
        desc.innerText = `D${sides} 굴리는 중...`;

        setTimeout(() => {
            const result = getRandom(sides);
            visual.innerText = result;
            desc.innerText = `D${sides} 결과: ${result}`;
            
            // 크리티컬 (최대값) 뜨면 색깔 바꾸기 효과
            if(result === sides) {
                visual.style.color = "#ff6b6b";
                visual.style.borderColor = "#ff6b6b";
            } else {
                visual.style.color = "var(--dice-text)";
                visual.style.borderColor = "#333";
            }

            visual.classList.remove('shake');
        }, 400);
    }
</script>

</body>
</html>
